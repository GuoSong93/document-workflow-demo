<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多文件流程实验室</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#152638;font:15px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:40px auto;padding:24px}header{background:#142d45;color:white;padding:30px;border-radius:18px}h1{margin:4px 0;font-size:32px}h2{font-size:19px}section{background:white;padding:24px;border:1px solid #d7dfe8;border-radius:14px;margin-top:20px}button{background:#007f79;border:0;border-radius:7px;color:white;padding:10px 16px;margin:6px 8px 6px 0;cursor:pointer}input,select,textarea{font:inherit;padding:9px;border:1px solid #b7c5d3;border-radius:6px;max-width:100%}textarea{width:100%;min-height:120px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f9;padding:16px;border-radius:8px;max-height:560px;overflow:auto}label{display:inline-block;margin:8px 12px 8px 0}a{color:#007f79}#notice{font-weight:600;color:#884913;min-height:26px}.tag{color:#7fe0cf}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}</style><main><header><span class="tag">PORTFOLIO / 02 · JAVA 21</span><h1>多文件流程实验室</h1><p>角色操作 · 版本冲突 · 持久化任务 · 重试与历史轮次</p></header><section><h2>01 / 发起一轮办理</h2><label><input id="guardian" type="checkbox">需要监护人确认</label><button id="start">创建流程</button><label>流程 ID <input id="id" size="42"></label><button id="load">加载流程</button><button id="next">新一轮办理</button><p>演示角色由页面选择，未接入身份认证。确认操作不构成法律电子签名。</p></section><section><h2>02 / 执行当前节点</h2><p id="step">先创建或加载流程。</p><label>角色 <select id="role"><option>APPLICANT</option><option>REVIEWER</option><option>GUARDIAN</option></select></label><label>版本 <input id="version" type="number" value="0" style="width:90px"></label><textarea id="payload">I confirm this synthetic document.</textarea><label><input id="fail" type="checkbox" checked>文件完成时注入一次归档失败</label><button id="act">提交当前步骤</button><button id="tick">执行一轮归档任务</button><button id="state">任务总览</button><div id="downloads"></div></section><section><div id="notice" role="status"></div><pre id="output"></pre></section></main><script>const $=id=>document.getElementById(id);async function api(path,body){const r=await fetch('/api'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||JSON.stringify(j));return j}function show(x){$('output').textContent=JSON.stringify(x,null,2)}async function run(fn){try{$('notice').textContent='';await fn()}catch(e){$('notice').textContent=e.message}}
function workflow(x){$('id').value=x.ID;$('version').value=x.VERSION;$('step').textContent=x.CURRENT?`文件 ${x.CURRENT.document} / ${x.CURRENT.kind} / ${x.CURRENT.role} / 第 ${x.ROUND_NO} 轮`:'业务步骤已完成；归档状态单独查看。';if(x.CURRENT)$('role').value=x.CURRENT.role;$('downloads').replaceChildren();for(const j of x.JOBS)if(j.STATE==='DONE'){const a=document.createElement('a');a.href='/api/archives/'+j.ID;a.textContent='下载文件 '+j.DOCUMENT_NAME+' 归档包 ';$('downloads').append(a)}show(x)}
$('start').onclick=()=>run(async()=>workflow(await api('/workflows',{templateId:'standard-v1',guardian:$('guardian').checked})));
$('next').onclick=()=>run(async()=>workflow(await api('/workflows',{templateId:'standard-v1',guardian:$('guardian').checked,previousId:$('id').value})));
$('load').onclick=()=>run(async()=>workflow(await api('/workflows/'+$('id').value)));
$('act').onclick=()=>run(async()=>workflow(await api('/workflows/'+$('id').value+'/actions',{version:Number($('version').value),role:$('role').value,payload:$('payload').value,failArchiveOnce:$('fail').checked})));
$('tick').onclick=()=>run(async()=>{await api('/worker/tick',{});if($('id').value)workflow(await api('/workflows/'+$('id').value));else show(await api('/state'))});
$('state').onclick=()=>run(async()=>show(await api('/state')));
</script></html>
